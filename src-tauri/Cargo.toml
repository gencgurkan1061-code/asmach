[package]
name = "asmach-ballooning"
version = "3.0.10"
description = "ASMach Inspection"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "asmach_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
