name: Build Windows installer

on:
  push:
    branches:
      - codex/release-3.0.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install dependencies
        run: npm ci
      - name: Verify release-critical behavior
        run: |
          node --test tests/installer-flow.test.cjs tests/license-release.test.cjs tests/license-request.test.cjs tests/requirements-test.cjs tests/tauri-bridge.test.cjs tests/radius-thread-regression.test.cjs tests/publisher-service.test.cjs tests/ocr-model-gate.test.cjs
          node scripts/check-license-release-ui.cjs
          node scripts/check-measurement-submenu.cjs
      - name: Build NSIS installer
        run: npm run desktop:build
      - name: Upload installer for validation
        uses: actions/upload-artifact@v4
        with:
          name: ASMach-Inspection-3.0.3-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*3.0.3*setup.exe
          if-no-files-found: error
          retention-days: 14
